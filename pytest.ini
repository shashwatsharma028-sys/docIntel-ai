[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
xfail_strict = true
markers =
    characterization: pins CURRENT behaviour (including a documented defect) for change detection only; not a statement of desired behaviour. Changing it requires approval citing the defect ID in docs/KNOWN_DEFECTS.md.
    known_defect: test describes DESIRED behaviour that the baseline does not meet; always paired with xfail(strict=True) and a defect ID.
filterwarnings =
    ignore:The `fitz` API is deprecated:FutureWarning
    ignore::DeprecationWarning:swig.*
